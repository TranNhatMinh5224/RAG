version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_prod_data:/qdrant/storage

  backend:
    image: 305068201208.dkr.ecr.ap-southeast-1.amazonaws.com/enterprise-rag-backend:latest
    container_name: rag_backend
    restart: always
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      - qdrant

  frontend:
    image: 305068201208.dkr.ecr.ap-southeast-1.amazonaws.com/enterprise-rag-frontend:latest
    container_name: rag_frontend
    restart: always
    ports:
      - "3000:3000"
    command: npm run start
    depends_on:
      - backend

volumes:
  qdrant_prod_data:
