version: '3.8'

services:
  qdrant:
    # Qdrant không nên expose port trực tiếp ra ngoài ở Production, chỉ các container khác mới gọi được.
    volumes:
      - qdrant_prod_data:/qdrant/storage
    restart: always

  backend:
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80" # Nginx phục vụ web trực tiếp trên port 80 (HTTP)
    restart: always

volumes:
  qdrant_prod_data:
