version: '3.8'

services:
  qdrant:
    # Qdrant không nên expose port trực tiếp ra ngoài ở Production, chỉ các container khác mới gọi được.
    volumes:
      - qdrant_prod_data:/qdrant/storage
    restart: always

  backend:
    image: 305068201208.dkr.ecr.ap-southeast-1.amazonaws.com/enterprise-rag-backend:latest
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: always

  frontend:
    image: 305068201208.dkr.ecr.ap-southeast-1.amazonaws.com/enterprise-rag-frontend:latest
    ports:
      - "3000:3000" # Phù hợp với AWS ALB Target Group (Port 3000)
    restart: always

volumes:
  qdrant_prod_data:
