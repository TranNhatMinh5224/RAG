version: '3.8'

services:
  qdrant:
    # Qdrant không nên expose port trực tiếp ra ngoài ở Production, chỉ các container khác mới gọi được.
    volumes:
      - qdrant_prod_data:/qdrant/storage
    restart: always

  backend:
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always

  frontend:
    ports:
      - "80:4173" # Ánh xạ port 80 (HTTP) vào port 4173 (Vite preview)
    command: >
      sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    restart: always

volumes:
  qdrant_prod_data:
