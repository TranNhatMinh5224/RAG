name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/frontend/**'

jobs:
  # BƯỚC 1: KIỂM THỬ XÂY DỰNG GIAO DIỆN (Build Test)
  build-test:
    name: Frontend Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'src/frontend/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./src/frontend
      run: |
        npm install --legacy-peer-deps

    - name: Run Build Test (Next.js Build Check)
      working-directory: ./src/frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: |
        npm run build

  # BƯỚC 2 & 3: BUILD, PUSH IMAGE VÀ DEPLOY CÔ LẬP (Chỉ chạy trên nhánh main khi build pass)
  build-and-deploy:
    name: Build, Push & Isolate Deploy
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/legal-rag-frontend:latest ./src/frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/legal-rag-frontend:latest

    - name: Isolate Deploy Frontend to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/legal-rag-project
          # Chỉ kéo image mới của frontend
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull frontend
          # Khởi động lại cô lập frontend (không chạm vào backend hay database)
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps frontend
          docker image prune -f
