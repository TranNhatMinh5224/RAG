name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/frontend/**'

jobs:
  # BƯỚC 1: KIỂM THỬ XÂY DỰNG GIAO DIỆN (Build Test)
  build-test:
    name: Frontend Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'src/frontend/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./src/frontend
      run: |
        npm install --legacy-peer-deps

    - name: Run Build Test (Next.js Build Check)
      working-directory: ./src/frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: |
        npm run build

  # BƯỚC 2 & 3: BUILD, PUSH IMAGE VÀ DEPLOY CÔ LẬP (Chỉ chạy trên nhánh main khi build pass)
  build-and-deploy:
    name: Build, Push & Isolate Deploy
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Frontend Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: enterprise-rag-frontend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./src/frontend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Isolate Deploy Frontend to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        timeout: 60s
        script: |
          if [ ! -d "$HOME/enterprise-rag-project" ]; then
            git clone https://github.com/TranNhatMinh5224/RAG.git "$HOME/enterprise-rag-project"
          fi
          cd "$HOME/enterprise-rag-project"
          git pull origin main || true
          # Đăng nhập ECR trên EC2 (dùng quyền IAM Role của EC2)
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 305068201208.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          # Kéo image mới nhất của frontend từ Amazon ECR
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull frontend
          # Khởi động lại cô lập frontend (không chạm vào backend hay database)
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps frontend
          # Dọn dẹp image cũ tiết kiệm bộ nhớ
          docker image prune -f
