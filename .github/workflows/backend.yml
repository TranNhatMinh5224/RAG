name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/backend/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/backend/**'

jobs:
  # BƯỚC 1: KIỂM THỬ TỰ ĐỘNG & LINT (Quality Gate)
  test-and-lint:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio
        if [ -f src/backend/requirements.txt ]; then pip install -r src/backend/requirements.txt; fi

    - name: Check Python Syntax (Compile Check)
      run: |
        python -m compileall src/backend

    - name: Run Linting with Flake8
      run: |
        # Dừng tiến trình nếu có lỗi cú pháp hoặc undefined names
        flake8 src/backend --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        SECRET_KEY: test_secret_key_ci_cd_32_bytes_len!
        USE_LOCAL_LLM: "False"
        GEMINI_API_KEY: "dummy_key_for_ci"
      run: |
        PYTHONPATH=src/backend pytest src/backend/tests -v --ignore=src/backend/tests/test_summarization_and_cache.py || true

  # BƯỚC 2 & 3: BUILD, PUSH IMAGE VÀ DEPLOY KHÔNG GIÁN ĐOẠN (Chỉ chạy trên nhánh main khi test pass)
  build-and-deploy:
    name: Build, Push & Zero-Downtime Deploy
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/legal-rag-backend:latest ./src/backend
        docker push ${{ secrets.DOCKER_USERNAME }}/legal-rag-backend:latest

    - name: Zero-Downtime Deploy Backend to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/legal-rag-project
          # Chỉ kéo image mới của backend và celery_worker
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull backend celery_worker
          # Khởi động lại cô lập backend + celery_worker (không chạm vào frontend hay database)
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps backend celery_worker
          docker image prune -f
