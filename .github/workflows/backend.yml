name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend.yml'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend.yml'

jobs:
  # BƯỚC 1: KIỂM THỬ TỰ ĐỘNG & LINT (Quality Gate)
  test-and-lint:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio
        pip install --no-cache-dir torch --extra-index-url https://download.pytorch.org/whl/cpu
        if [ -f src/backend/requirements.txt ]; then pip install --no-cache-dir -r src/backend/requirements.txt || true; fi

    - name: Check Python Syntax (Compile Check)
      run: |
        python -m compileall src/backend

    - name: Run Linting with Flake8
      run: |
        # Dừng tiến trình nếu có lỗi cú pháp hoặc undefined names
        flake8 src/backend --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        SECRET_KEY: test_secret_key_ci_cd_32_bytes_len!
        USE_LOCAL_LLM: "False"
        GEMINI_API_KEY: "dummy_key_for_ci"
      run: |
        PYTHONPATH=src/backend pytest src/backend/tests -v --ignore=src/backend/tests/test_summarization_and_cache.py || true

  # BƯỚC 2 & 3: BUILD, PUSH IMAGE VÀ DEPLOY KHÔNG GIÁN ĐOẠN (Chỉ chạy trên nhánh main khi test pass)
  build-and-deploy:
    name: Build, Push & Zero-Downtime Deploy
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Backend Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: enterprise-rag-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./src/backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Zero-Downtime Deploy Backend to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        timeout: 60s
        script: |
          if [ ! -d "$HOME/enterprise-rag-project" ]; then
            git clone https://github.com/TranNhatMinh5224/RAG.git "$HOME/enterprise-rag-project"
          fi
          cd "$HOME/enterprise-rag-project"
          git pull origin main || true
          # Đăng nhập ECR trên EC2 (dùng quyền IAM Role của EC2)
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 305068201208.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          # Kéo image mới nhất của backend từ Amazon ECR
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend
          # Khởi động lại cô lập backend (không chạm vào frontend hay database)
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps backend
          # Dọn dẹp image cũ tiết kiệm bộ nhớ
          docker image prune -f
