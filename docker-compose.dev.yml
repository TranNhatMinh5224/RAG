version: '3.8'

services:
  qdrant:
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - ./data:/app/data # Thư mục chứa file PDF để đọc offline
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
